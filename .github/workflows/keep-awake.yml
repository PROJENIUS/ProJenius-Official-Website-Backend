name: Keep the backend awake

# Render's free plan puts the server to sleep after 15 minutes without
# visitors; the next visitor then waits 1-2 minutes. This pings the health
# check every 10 minutes so it stays awake (one always-on service uses about
# 730 of Render's 750 free hours a month). GitHub may delay scheduled runs by
# a few minutes, and pauses them after 60 days without commits; a second
# pinger such as cron-job.org (DEPLOY-FREE-TIER.md, step 5) is a good backup.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping /api/health (waits up to 3 minutes for a cold start)
        run: |
          curl --proto '=https' --tlsv1.2 --silent --show-error --max-time 180 \
            --retry 2 --retry-delay 10 \
            https://projenius-official-website-backend.onrender.com/api/health
